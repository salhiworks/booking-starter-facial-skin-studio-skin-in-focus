<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Morrow Skin Studio — facials in Rockridge, Oakland</title>
    <meta name="description" content="An independent skin studio in Rockridge, Oakland: signature, hydration, calming and express facials, facial massage and skincare consultations with one esthetician. Book online." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Morrow Skin Studio — facials in Rockridge, Oakland" />
    <meta property="og:description" content="An independent skin studio in Rockridge, Oakland: signature, hydration, calming and express facials, facial massage and skincare consultations with one esthetician. Book online." />
    <meta name="theme-color" content="#f4efe9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The hero photo: the near-square crop from 600 px, an upright crop below.
         imagesizes must match HERO_SIZES / SMALL in src/components/Hero.tsx. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(min-width: 600px)"
      imagesrcset="/photos/hero-campaign-800.avif 800w, /photos/hero-campaign-1200.avif 1200w, /photos/hero-campaign-1600.avif 1600w, /photos/hero-campaign-2000.avif 2000w"
      imagesizes="(min-width: 1024px) min(56vw, 50rem), 100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-width: 599px)"
      imagesrcset="/photos/hero-campaign-phone-480.avif 480w, /photos/hero-campaign-phone-800.avif 800w, /photos/hero-campaign-phone-1200.avif 1200w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
